services:
  db:
    image: postgres:15
    container_name: jobhunter_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - jobhunter_pgdata:/var/lib/postgresql/data

volumes:
  jobhunter_pgdata: